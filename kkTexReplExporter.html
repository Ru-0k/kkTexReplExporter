<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <title>角色卡贴图替换 by R菌</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0f0f0;
      padding: 10px 20px;
      border-bottom: 1px solid #ccc;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header a {
      text-decoration: none;
      color: blue;
      font-size: 16px;
    }
    #toolbar {
      position: fixed;
      bottom: 0;
      background: white;
      padding: 10px;
      border-top: 1px solid #ccc;
      width: 100%;
      z-index: 1000;
    }
    .thumbnail-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 80px 10px 100px; /* 留出 header 和 toolbar 的空间 */
    }
    .thumbnail-item {
      border: 1px solid #ddd;
      padding: 5px;
      position: relative;
      text-align: center;
      width: 256px;
    }
    .thumbnail-img {
      max-width: 256px;
      max-height: 256px;
      display: block;
      margin: 0 auto;
    }
    /* 序号显示在右上角，带阴影和半透明底纹 */
    .file-index {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 2px 4px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }
    /* 复选框显示在左上角 */
    .thumbnail-item input[type="checkbox"] {
      position: absolute;
      top: 0;
      left: 0;
      margin: 5px;
      z-index: 10;
    }
    /* 替换按钮样式（浮于缩略图左下角） */
    .thumbnail-item .replace-button {
      position: absolute;
      bottom: 25px;
      left: 5px;
      padding: 1px 2px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      font-size: 12px;
      cursor: pointer;
      z-index: 10;
    }
    /* 图片信息区分为两行 */
    .img-info div {
      line-height: 1.4;
    }

  </style>
</head>
<body>
  <header>
    <h1>角色卡贴图替换</h1>
    <a href="https://github.com/Ru-0k/kkTexReplExporter" target="_blank">GitHub</a>
  </header>
  <div class="selection-panel">
    <input type="file" id="fileInput" style="display: none;">
    <button onclick="document.getElementById('fileInput').click()">读取文件</button>
  </div>
  <div class="thumbnail-container" id="thumbnailContainer"></div>
  <div id="toolbar">
    <button onclick="exportSelected()">导出选中</button>
    <button onclick="updateOriginal()">另存新卡</button>
  </div>

<script>
/* ======== 全局变量 ======== */
let originalFileData = null;     // 原始文件的 Uint8Array 数据
let fileName = "";
let fileExt = "";
let fileNameWithoutExtension = "";

// textures：每个元素：
//   {
//     lenPos:          number,           // getlen()标志位置；id_photo为大小标志起始；special为0
//     start:           number,           // 图片数据起始位置
//     end:             number,           // 图片数据末尾位置（不含）
//     cat:             string,           // "special" | "id_photo" | "TextureDictionary" | "Overlays" | "standalone"
//     bankFirst:       boolean,          // 是否是库内第一个贴图（紧随库大小标志之后）
//     index:           number,           // 序号（1-based，用于显示和导出）
//     originalData:    Uint8Array,       // 原始图片数据
//     replacementData: Uint8Array|null   // 用户选择的替换图片数据
//   }
let textures = [];

/* ======== 工具函数 ======== */
function hexStringToUint8Array(hexString) {
  if (hexString.length % 2 !== 0) throw "Invalid hexString";
  let array = new Uint8Array(hexString.length / 2);
  for (let i = 0; i < hexString.length; i += 2) {
    array[i / 2] = parseInt(hexString.substr(i, 2), 16);
  }
  return array;
}

function concatUint8Arrays(arrays) {
  let totalLength = arrays.reduce((acc, arr) => acc + arr.length, 0);
  let result = new Uint8Array(totalLength);
  let offset = 0;
  arrays.forEach(arr => { result.set(arr, offset); offset += arr.length; });
  return result;
}

function replaceSegment(original, start, end, replacement) {
  return concatUint8Arrays([original.slice(0, start), replacement, original.slice(end)]);
}

function indexOfSubarray(haystack, needle, fromIndex = 0, toIndex = haystack.length) {
  for (let i = fromIndex; i <= toIndex - needle.length; i++) {
    let found = true;
    for (let j = 0; j < needle.length; j++) {
      if (haystack[i + j] !== needle[j]) { found = false; break; }
    }
    if (found) return i;
  }
  return -1;
}

function lastIndexOfSubarray(haystack, needle, fromIndex = 0, toIndex = haystack.length) {
  for (let i = toIndex - needle.length; i >= fromIndex; i--) {
    let found = true;
    for (let j = 0; j < needle.length; j++) {
      if (haystack[i + j] !== needle[j]) { found = false; break; }
    }
    if (found) return i;
  }
  return -1;
}

// 读取 getlen() 格式的长度标志（c4/c5/c6 + 1/2/4字节大端序长度值）
// 返回 { value: 长度数值, lenBytes: 长度字节数（不含类型字节） }
function readGetlen(data, pos) {
  const typeByte = data[pos];
  if (typeByte < 0xc4 || typeByte > 0xc6) {
    throw new Error(`readGetlen: 非法类型字节 0x${typeByte.toString(16)}（位置 ${pos}）`);
  }
  const lenBytes = Math.pow(2, typeByte - 0xc4); // c4→1, c5→2, c6→4
  let value = 0;
  for (let i = 0; i < lenBytes; i++) {
    value = value * 256 + data[pos + 1 + i]; // 大端序
  }
  return { value, lenBytes };
}

// 查找 _TextureID_\d{4} 模式，返回该模式起始位置，未找到则返回 -1
function findTextureIDMarker(data, fromIndex) {
  for (let i = fromIndex; i <= data.length - TEXTURE_ID_TOTAL_LEN; i++) {
    let match = true;
    for (let j = 0; j < textureID_prefix.length; j++) {
      if (data[i + j] !== textureID_prefix[j]) { match = false; break; }
    }
    if (!match) continue;
    let digitsOk = true;
    for (let k = 0; k < 4; k++) {
      const b = data[i + textureID_prefix.length + k];
      if (b < 0x30 || b > 0x39) { digitsOk = false; break; }
    }
    if (digitsOk) return i;
  }
  return -1;
}

// 查找有效的库标志（紧跟其后的字节必须是 c4/c5/c6，否则视为误匹配继续搜索）
function findValidLibraryMarker(data, marker, fromPos) {
  let searchPos = fromPos;
  while (true) {
    const pos = indexOfSubarray(data, marker, searchPos);
    if (pos === -1) return -1;
    const afterMarker = pos + marker.length;
    const typeByte = data[afterMarker];
    if (typeByte === 0xc4 || typeByte === 0xc5 || typeByte === 0xc6) return pos;
    searchPos = pos + 1; // 该处是误匹配，从下一个字节继续搜索
  }
}

// 在 [fromPos, toPos) 范围内查找所有图片起始位置（PNG/JPEG/WEBP 魔数）
function findAllImageStarts(data, fromPos, toPos) {
  const starts = [];
  for (let i = fromPos; i < toPos; i++) {
    // PNG: 89 50 4E 47
    if (i + 4 <= toPos &&
        data[i]===0x89 && data[i+1]===0x50 && data[i+2]===0x4E && data[i+3]===0x47) {
      starts.push(i);
    }
    // JPEG: FF D8 FF
    else if (i + 3 <= toPos &&
        data[i]===0xFF && data[i+1]===0xD8 && data[i+2]===0xFF) {
      starts.push(i);
    }
    // WEBP: 52 49 46 46 ?? ?? ?? ?? 57 45 42 50
    else if (i + 12 <= toPos &&
        data[i]===0x52 && data[i+1]===0x49 && data[i+2]===0x46 && data[i+3]===0x46 &&
        data[i+8]===0x57 && data[i+9]===0x45 && data[i+10]===0x42 && data[i+11]===0x50) {
      starts.push(i);
    }
  }
  return starts;
}

// 在图片起始位置之前寻找紧贴的 getlen() 类型字节（c4/c5/c6）
// bankContentStart: lenPos 不得低于此值；bankEnd: imgEnd 不得超过此值
// 返回 { lenPos, value }，未找到则返回 null
function findGetlenBefore(data, imgStart, bankContentStart, bankEnd) {
  // 尝试 c4（1字节长度），lenPos = imgStart - 2
  if (imgStart - 2 >= bankContentStart && data[imgStart - 2] === 0xc4) {
    const value = data[imgStart - 1];
    if (imgStart + value <= bankEnd) return { lenPos: imgStart - 2, value };
  }
  // 尝试 c5（2字节长度），lenPos = imgStart - 3
  if (imgStart - 3 >= bankContentStart && data[imgStart - 3] === 0xc5) {
    const value = data[imgStart - 2] * 0x100 + data[imgStart - 1];
    if (imgStart + value <= bankEnd) return { lenPos: imgStart - 3, value };
  }
  // 尝试 c6（4字节长度），lenPos = imgStart - 5
  if (imgStart - 5 >= bankContentStart && data[imgStart - 5] === 0xc6) {
    const value = data[imgStart - 4] * 0x1000000 + data[imgStart - 3] * 0x10000 +
                  data[imgStart - 2] * 0x100 + data[imgStart - 1];
    if (imgStart + value <= bankEnd) return { lenPos: imgStart - 5, value };
  }
  return null;
}

// 从图片数据的魔数检测 MIME 类型（png / jpeg / webp）
function getImageMimeType(data) {
  if (data.length >= 4 &&
      data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4E && data[3] === 0x47) {
    return "image/png";
  }
  if (data.length >= 3 &&
      data[0] === 0xFF && data[1] === 0xD8 && data[2] === 0xFF) {
    return "image/jpeg";
  }
  if (data.length >= 12 &&
      data[0] === 0x52 && data[1] === 0x49 && data[2] === 0x46 && data[3] === 0x46 &&
      data[8] === 0x57 && data[9] === 0x45 && data[10] === 0x42 && data[11] === 0x50) {
    return "image/webp";
  }
  return "image/png"; // 兜底
}

// 根据图片数据的魔数返回对应扩展名
function getImageExtension(data) {
  const mime = getImageMimeType(data);
  if (mime === "image/jpeg") return ".jpg";
  if (mime === "image/webp") return ".webp";
  return ".png";
}

/* ======== getlen 函数（用于生成写入用的长度标志） ======== */
function getlen(lengthOfBytes, type) {
  lengthOfBytes = parseInt(lengthOfBytes, 10);
  if (lengthOfBytes < 0 || lengthOfBytes > 0xffffffff) {
    throw new Error("Value out of range");
  }
  if (type !== undefined) {
    if (type === 1) return { hexStr: "c4" + lengthOfBytes.toString(16).padStart(2, '0'), len: 1 };
    if (type === 2) return { hexStr: "c5" + lengthOfBytes.toString(16).padStart(4, '0'), len: 2 };
    if (type === 3 || type === 4) return { hexStr: "c6" + lengthOfBytes.toString(16).padStart(8, '0'), len: 4 };
    throw new Error("Invalid type");
  }
  let hexStr = lengthOfBytes.toString(16).padStart(8, '0');
  let bytesArr = [];
  for (let i = 0; i < 8; i += 2) bytesArr.push(parseInt(hexStr.substr(i, 2), 16));
  let index = -1;
  for (let i = 0; i < bytesArr.length; i++) { if (bytesArr[i] !== 0) { index = i; break; } }
  const computedType = 4 - index;
  if (computedType === 1) return { hexStr: "c4" + lengthOfBytes.toString(16).padStart(2, '0'), len: 1 };
  if (computedType === 2) return { hexStr: "c5" + lengthOfBytes.toString(16).padStart(4, '0'), len: 2 };
  if (computedType === 3 || computedType === 4) return { hexStr: "c6" + lengthOfBytes.toString(16).padStart(8, '0'), len: 4 };
  throw new Error("Computed type out of range");
}

/* ======== upd_idx 函数 ======== */
// firstconf 对应 ["lenPos", "start", "end"] 三个字段的更新开关
function upd_idx(old_len, new_len, texList, pos, firstconf) {
  const keys = ["lenPos", "start", "end"];
  const diff = new_len - old_len;
  if (diff !== 0) {
    for (let j = 0; j < 3; j++) texList[pos][keys[j]] += firstconf[j] * diff;
    for (let i = pos + 1; i < texList.length; i++)
      for (let j = 0; j < 3; j++) texList[i][keys[j]] += diff;
  }
}

/* ======== 标志定义 ======== */
const start_marker      = hexStringToUint8Array("89504e47"); // PNG 起始
const end_marker        = hexStringToUint8Array("ae426082"); // PNG 结尾
const txtrdic_marker    = new TextEncoder().encode("TextureDictionary");
const overlay_marker    = new TextEncoder().encode("Overlays");
const textureID_prefix  = new TextEncoder().encode("_TextureID_"); // 散图片标志前缀
const TEXTURE_ID_TOTAL_LEN = textureID_prefix.length + 4;          // _TextureID_ + 4位数字 = 15字节

/* ======== 文件读取与贴图扫描 ======== */
document.getElementById("fileInput").addEventListener("change", function(event) {
  const file = event.target.files[0];
  if (!file) return;

  fileName = file.name;
  fileExt = fileName.substring(fileName.lastIndexOf('.'));
  fileNameWithoutExtension = fileName.substring(0, fileName.lastIndexOf('.'));

  const reader = new FileReader();
  reader.onload = function(e) {
    originalFileData = new Uint8Array(e.target.result);
    textures = [];

    // ── 1. 卡面（第一个 PNG，无大小标志，必须是 PNG）──────────────────────
    const cfStart = indexOfSubarray(originalFileData, start_marker, 0);
    const cfEndRaw = indexOfSubarray(originalFileData, end_marker, 0);
    if (cfStart === -1 || cfEndRaw === -1) { displayThumbnails(); return; }
    const cfEnd = cfEndRaw + end_marker.length;

    textures.push({
      lenPos: 0, start: cfStart, end: cfEnd,
      cat: "special", bankFirst: false, index: 1,
      originalData: originalFileData.slice(cfStart, cfEnd),
      replacementData: null
    });

    // ── 2. 证件照（第二个 PNG，4字节小端序大小标志，必须是 PNG）──────────
    const idStart = indexOfSubarray(originalFileData, start_marker, cfEnd);
    const idEndRaw = indexOfSubarray(originalFileData, end_marker, cfEnd);
    if (idStart === -1 || idEndRaw === -1) { displayThumbnails(); return; }
    const idEnd = idEndRaw + end_marker.length;

    textures.push({
      lenPos: idStart - 4, start: idStart, end: idEnd,
      cat: "id_photo", bankFirst: false, index: 2,
      originalData: originalFileData.slice(idStart, idEnd),
      replacementData: null
    });

    // ── 3+. 纹理库、贴图库、散图片（getlen() 大小标志，png/jpg/webp）──────
    let scanPos = idEnd;

    try {
      while (scanPos < originalFileData.length) {
        // 在当前位置后分别查找三种标志，取最近的一个
        // 库标志必须紧跟有效的 getlen() 类型字节（c4/c5/c6），否则视为误匹配
        const txPos = findValidLibraryMarker(originalFileData, txtrdic_marker, scanPos);
        const ovPos = findValidLibraryMarker(originalFileData, overlay_marker, scanPos);
        const tiPos = findTextureIDMarker(originalFileData, scanPos);

        const candidates = [];
        if (txPos !== -1) candidates.push({ pos: txPos, type: "TextureDictionary" });
        if (ovPos !== -1) candidates.push({ pos: ovPos, type: "Overlays" });
        if (tiPos !== -1) candidates.push({ pos: tiPos, type: "standalone" });
        if (candidates.length === 0) break;

        candidates.sort((a, b) => a.pos - b.pos);
        const nearest = candidates[0];

        if (nearest.type === "standalone") {
          // 散图片：_TextureID_XXXX + getlen() + 图片数据
          const lenPos = tiPos + TEXTURE_ID_TOTAL_LEN;
          const { value: imgSize, lenBytes } = readGetlen(originalFileData, lenPos);
          const imgStart = lenPos + 1 + lenBytes;
          const imgEnd   = imgStart + imgSize;

          textures.push({
            lenPos, start: imgStart, end: imgEnd,
            cat: "standalone", bankFirst: false,
            index: textures.length + 1,
            originalData: originalFileData.slice(imgStart, imgEnd),
            replacementData: null
          });

          scanPos = imgEnd;

        } else {
          // 库（TextureDictionary 或 Overlays）：
          //   [库名] [getlen():库大小] [图片1 getlen():大小] [图片1数据] [图片2...] [0xc2 仅Overlays]
          const marker = nearest.type === "TextureDictionary" ? txtrdic_marker : overlay_marker;
          const banklenPos = nearest.pos + marker.length;
          const { value: bankSize, lenBytes: bankLenBytes } = readGetlen(originalFileData, banklenPos);
          const bankContentStart = banklenPos + 1 + bankLenBytes;
          const bankEnd          = bankContentStart + bankSize;

          // Overlays 库内容末尾有一字节 0xc2，不属于任何图片
          const imgScanEnd = nearest.type === "Overlays" ? bankEnd - 1 : bankEnd;

          // 库内图片之间（以及库大小标志之后、第一张图之前）可能存在任意数据，
          // 不能按顺序逐个读取 getlen()，需通过魔数定位每张图片的起始位置
          const imgStarts = findAllImageStarts(originalFileData, bankContentStart, imgScanEnd);
          let isFirst = true;
          let lastImgEnd = bankContentStart;

          for (const imgStart of imgStarts) {
            // 跳过落在已处理图片数据内的误匹配魔数
            if (imgStart < lastImgEnd) continue;

            const glenResult = findGetlenBefore(originalFileData, imgStart, bankContentStart, imgScanEnd);
            if (glenResult === null) continue; // 无法找到紧贴的 getlen()，跳过此误匹配

            const imgEnd = imgStart + glenResult.value;

            textures.push({
              lenPos: glenResult.lenPos, start: imgStart, end: imgEnd,
              cat: nearest.type, bankFirst: isFirst,
              index: textures.length + 1,
              originalData: originalFileData.slice(imgStart, imgEnd),
              replacementData: null
            });

            isFirst = false;
            lastImgEnd = imgEnd;
          }

          scanPos = bankEnd;
        }
      }
    } catch (err) {
      console.error("贴图扫描出错：", err);
      // 出错前已扫描到的贴图仍正常显示
    }

    displayThumbnails();
  };
  reader.readAsArrayBuffer(file);
});

/* ======== 显示缩略图 ======== */
function displayThumbnails() {
  const container = document.getElementById("thumbnailContainer");
  container.innerHTML = "";

  textures.forEach(item => {
    const div = document.createElement("div");
    div.className = "thumbnail-item";

    // 复选框（左上角）
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = "checkbox-" + item.index;
    div.appendChild(checkbox);

    // 序号（右上角）
    const indexP = document.createElement("div");
    indexP.className = "file-index";
    indexP.textContent = item.index;
    div.appendChild(indexP);

    // 图片
    const img = document.createElement("img");
    img.className = "thumbnail-img";
    const origMime = getImageMimeType(item.originalData);
    img.src = URL.createObjectURL(new Blob([item.originalData], { type: origMime }));
    div.appendChild(img);

    // 信息区
    const infoDiv = document.createElement("div");
    infoDiv.className = "img-info";
    infoDiv.style.fontSize = "12px";
    infoDiv.style.marginTop = "5px";

    const originalInfoDiv = document.createElement("div");
    originalInfoDiv.className = "original-info";
    originalInfoDiv.textContent = "加载中...";

    const replacementInfoDiv = document.createElement("div");
    replacementInfoDiv.className = "replacement-info";
    replacementInfoDiv.textContent = "";

    infoDiv.appendChild(originalInfoDiv);
    infoDiv.appendChild(replacementInfoDiv);
    div.appendChild(infoDiv);

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      else if (bytes < 1023488) return (bytes / 1024).toPrecision(3) + " kB";
      else return (bytes / (1024 * 1024)).toPrecision(3) + " MB";
    }

    img.onload = function() {
      if (!item.replacementData) {
        const maxSide = Math.max(img.naturalWidth, img.naturalHeight);
        if (maxSide < 256) {
          const factor = 256 / maxSide;
          img.style.width  = (img.naturalWidth  * factor) + "px";
          img.style.height = (img.naturalHeight * factor) + "px";
        } else {
          img.style.width = img.style.height = "";
        }
        originalInfoDiv.textContent =
          `${img.naturalWidth}x${img.naturalHeight}, ${formatSize(item.originalData.length)}`;
      } else {
        img.style.width = img.style.height = "";
        replacementInfoDiv.textContent =
          `替换: ${img.naturalWidth}x${img.naturalHeight}, ${formatSize(item.replacementData.length)}`;
      }
    };

    // 替换按钮
    const replaceLabel = document.createElement("label");
    replaceLabel.className = "replace-button";
    replaceLabel.textContent = "替换";
    const replaceInput = document.createElement("input");
    replaceInput.type = "file";
    replaceInput.accept = "image/png,image/jpeg,image/webp";
    replaceInput.style.display = "none";
    replaceInput.addEventListener("change", function(e) {
      const f = e.target.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = function(ev) {
        const newData = new Uint8Array(ev.target.result);
        item.replacementData = newData;
        const newMime = getImageMimeType(newData);
        img.src = URL.createObjectURL(new Blob([newData], { type: newMime }));
        replacementInfoDiv.textContent =
          `替换: ${img.naturalWidth}x${img.naturalHeight}, ${formatSize(newData.length)}`;
      };
      fr.readAsArrayBuffer(f);
    });
    replaceLabel.appendChild(replaceInput);
    div.appendChild(replaceLabel);

    container.appendChild(div);
  });
}

/* ======== "导出选中" 按钮 ======== */
function exportSelected() {
  const selectedItems = textures.filter(item => {
    const cb = document.getElementById("checkbox-" + item.index);
    return cb && cb.checked;
  });

  if (selectedItems.length <= 3) {
    selectedItems.forEach(item => {
      const data = item.replacementData || item.originalData;
      const blob = new Blob([data], { type: getImageMimeType(data) });
      const ext  = getImageExtension(data);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${fileNameWithoutExtension}_${item.index.toString().padStart(3, '0')}${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  } else {
    let zip = new JSZip();
    selectedItems.forEach(item => {
      const data = item.replacementData || item.originalData;
      const ext  = getImageExtension(data);
      zip.file(`${fileNameWithoutExtension}_${item.index.toString().padStart(3, '0')}${ext}`, data);
    });
    zip.generateAsync({ type: "blob" }).then(function(content) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(content);
      a.download = `${fileNameWithoutExtension}_export.zip`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  }
}

/* ======== "另存新卡" 按钮 ======== */
function updateOriginal() {
  let overwrt_data = originalFileData.slice();
  let textures_new = textures.map(t => Object.assign({}, t));
  let bank_count = 0;
  let count_endi = 0;
  const count = textures.length;

  for (let i = count - 1; i >= 0; i--) {
    const tex = textures[i];
    const replacementData = tex.replacementData || tex.originalData;
    const oldLength = tex.end - tex.start;
    const newLength = replacementData.length;

    // 替换图片数据
    overwrt_data = replaceSegment(overwrt_data, textures_new[i].start, textures_new[i].end, replacementData);
    upd_idx(oldLength, newLength, textures_new, i, [0, 0, 1]);

    // 更新图片自身的 getlen() 大小标志
    // 适用于库内图片（TextureDictionary/Overlays）和散图片（standalone）
    if (tex.cat !== "special" && tex.cat !== "id_photo") {
      const { len: old_len_offset } = getlen(oldLength);
      textures[i].lenPos     = tex.start - old_len_offset - 1;
      textures_new[i].lenPos = textures[i].lenPos;

      const { hexStr: new_len_marker, len: new_len_offset } = getlen(newLength);
      const new_len_bytes = hexStringToUint8Array(new_len_marker);
      overwrt_data = replaceSegment(
        overwrt_data,
        textures_new[i].start - old_len_offset - 1,
        textures_new[i].start,
        new_len_bytes
      );
      upd_idx(old_len_offset, new_len_offset, textures_new, i, [0, 1, 1]);
    }

    // 若该图片是某个库的首个图片，则更新该库的 getlen() 大小标志
    // 散图片（standalone）的 bankFirst 为 false，不触发此分支
    if (tex.bankFirst) {
      const bank_marker = tex.cat === "TextureDictionary" ? txtrdic_marker : overlay_marker;

      const searchStart = i > 0 ? textures_new[i - 1].end : 0;
      const searchEnd   = textures_new[i].start;
      const segment     = overwrt_data.slice(searchStart, searchEnd);
      const bank_rel    = lastIndexOfSubarray(segment, bank_marker, 0, segment.length);
      if (bank_rel === -1) { alert("未找到库标志，处理出错！"); return; }

      const bank_idx    = searchStart + bank_rel;
      const banklen_idx = bank_idx + bank_marker.length;

      const bankend_idx = bank_count === 0
        ? textures_new[textures_new.length - 1].end
        : textures_new[count_endi].end;

      const old_len_offset_bank = Math.pow(2, overwrt_data[banklen_idx] - 0xc4);
      const bankstart_idx       = banklen_idx + 1 + old_len_offset_bank;
      const bank_data_length    = bankend_idx - bankstart_idx + (tex.cat === "Overlays" ? 1 : 0);

      const { hexStr: bank_new_marker, len: bank_new_len_offset } = getlen(bank_data_length);
      overwrt_data = replaceSegment(
        overwrt_data,
        banklen_idx,
        banklen_idx + old_len_offset_bank + 1,
        hexStringToUint8Array(bank_new_marker)
      );
      upd_idx(old_len_offset_bank, bank_new_len_offset, textures_new, i, [1, 1, 1]);

      count_endi = i - 1;
      bank_count++;
    }

    // 证件照：4字节小端序大小标志
    if (tex.cat === "id_photo") {
      const data_len_buf = hexStringToUint8Array(newLength.toString(16).padStart(8, '0')).reverse();
      overwrt_data = replaceSegment(
        overwrt_data,
        textures_new[i].start - 4,
        textures_new[i].start,
        data_len_buf
      );
    }
  }

  const blob = new Blob([overwrt_data], { type: "application/octet-stream" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `${fileNameWithoutExtension}_replaced${fileExt}`;
  a.click();
  URL.revokeObjectURL(url);
}
